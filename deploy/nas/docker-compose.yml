# Mhu Solar Analytics on a Synology NAS (Container Manager) — see deploy/nas/README.md.
# Secrets live in deploy/nas/.env on the NAS (never in git): SolisCloud keys and the web key.
# Data lives in ./data (homes.json + CSVs, copied from the Mac once).
services:
  web:
    build: { context: ../.., dockerfile: deploy/nas/Dockerfile, target: web }
    image: mhu-solar-web
    environment:
      SOLAR_WEB_KEY: ${SOLAR_WEB_KEY:?set SOLAR_WEB_KEY in .env}
    volumes:
      - ./data:/srv/data:ro
    ports:
      - "8090:8080" # LAN: http://<nas>:8090/?key=…
    depends_on: [gate]
    restart: unless-stopped

  # Guest links that expire (python -m momsolar.guest serve): same image as the poller, ~20 MB RAM,
  # only reachable from `web`. Changing SOLAR_GUEST_SECRET cancels every guest link.
  gate:
    image: mhu-solar-poller
    command: ["python", "-m", "momsolar.guest", "serve", "--port", "8081"]
    environment:
      SOLAR_GUEST_SECRET: ${SOLAR_GUEST_SECRET:?set SOLAR_GUEST_SECRET in .env}
    depends_on: [poller]
    restart: unless-stopped

  poller:
    build: { context: ../.., dockerfile: deploy/nas/Dockerfile, target: poller }
    image: mhu-solar-poller
    env_file: .env
    environment:
      TZ: Asia/Bangkok
      MOMSOLAR_SOLIS_USAGE_FILE: /state/solis_usage.json
    volumes:
      - ./data:/data
      - ./state:/state
      - ./reports:/reports # MhuHome FusionSolar reports saved by solar_pipeline
      - ./pipeline:/pipeline # optional: solar_pipeline (fetch_solar_report.py + Gmail token; writable for token refresh)
    restart: unless-stopped

# The Cloudflare Tunnel connector is not part of this project: it runs on its own in
# /volume1/docker/cloudflared (host network) and reaches the web UI at 192.168.1.10:8090.
